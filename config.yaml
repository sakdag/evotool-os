# LLM Configuration
# Using GPTQ-Int8 quantized variant: ~8-9 GiB weights, significantly better
# quality than 4-bit AWQ while still fitting on a 16 GiB GPU (RTX 5070 Ti).
# Fallback: set to "Qwen/Qwen3-8B-AWQ" if GPTQ model is not yet downloaded.
llm:
  agent_model: "JunHowie/Qwen3-8B-GPTQ-Int8"
  blamer_model: "JunHowie/Qwen3-8B-GPTQ-Int8"
  mutator_model: "JunHowie/Qwen3-8B-GPTQ-Int8"
  base_url: "http://localhost:8000/v1"
  api_key: "dummy"
  # Agent modules run without extended thinking (speed + token economy)
  agent_thinking: false
  # Blamer outputs structured text (scores + evidence) — thinking mode burns all
  # tokens on reasoning and leaves none for the actual formatted output.
  blamer_thinking: false
  # Mutator benefits from extended reasoning to craft improved prompts
  mutator_thinking: true
  max_tokens: 2048
  # Qwen3-8B-AWQ with temperature=0 (greedy) causes the Selector module to refuse
  # to output JSON and instead ask for more information on almost every call.
  # 0.7 keeps enough stochasticity for the Selector to work while still being
  # reasonable for evaluation.
  temperature: 0.7
  # Fallback to OpenAI API if local inference quality is insufficient
  # Set OPENAI_API_KEY env var to enable
  fallback_model: null  # e.g. "gpt-4.1"

# EVOTOOL Hyperparameters (from Appendix A.6)
evotool:
  max_generations: 8       # G
  mini_batch_size: 3       # B
  initial_population_size: 1
  max_steps_per_episode: 30
  # Parallel episode evaluation: vLLM handles ~3 concurrent 32k-token requests.
  # Set to 1 to disable parallelism (sequential, lower memory pressure).
  max_workers: 3

# Data Splits (seed=42 for reproducibility)
data_splits:
  tau_bench_retail:
    train_size: 100
    sel_size: 50
    seed: 42
    train_split: "train"   # retail has train/dev/test splits
    test_split: "test"
  tau_bench_airline:
    # Airline only has 50 tasks total (one split).
    # Paper evaluates on the full official test split (all 50 tasks),
    # while carving out S_train(30) + S_sel(10) from the same 50.
    # test_offset=0 → eval on all 50 (matches paper's "official evaluation split").
    train_size: 30
    sel_size: 10
    seed: 42
    train_split: "test"    # airline only has test split
    test_split: "test"
    test_offset: 40        # skip train(30)+sel(10) tasks; evaluate only on 10 holdout tasks
  bfcl_single:
    train_size: 200
    sel_size: 100
    seed: 42
    categories:
      - "simple_python"
      - "multiple"
      - "parallel"
      - "parallel_multiple"
  bfcl_multi:
    train_size: 100
    sel_size: 50
    seed: 42
    categories:
      - "multi_turn_base"

# τ-Bench Configuration
tau_bench:
  user_strategy: "llm"
  user_model: "JunHowie/Qwen3-8B-GPTQ-Int8"
  user_provider: "openai"
  # vLLM server will be used for the user simulator via OPENAI_BASE_URL env var

# BFCL Configuration
bfcl:
  project_root: "experiments/bfcl"
  result_dir: "experiments/bfcl/result"

# Paths
paths:
  results_dir: "experiments/results"
  logs_dir: "experiments/logs"
